[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bananabread-emb"
version = "0.6.0"
description = "A way to slip MixedBread's reranker and embedder into a lot of places it doesn't belong."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Prolix Creates", email = "info@prolix.dev"},
]
maintainers = [
    {name = "Prolix Creates", email = "info@prolix.dev"},
]
keywords = ["ai", "embeddings", "reranking", "mixedbread", "fastapi", "ml"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: FastAPI",
]

dependencies = [
    # Web framework and server
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.10.0,<3.0.0",
    # Machine learning and AI
    # Keep AMD's native-Windows 2.9.1 wheel valid while the shared lockfile
    # selects Torch 2.14 for CUDA, ROCm, macOS, and CPU environments.
    "torch>=2.9.0,<2.15.0",
    # Nemotron-3.5 image inputs need the FlashAttention fixes in 5.20.0.
    "transformers==5.20.0",
    # 0.32+ integrates hf-xet into the standard Hub download APIs.
    "huggingface-hub>=0.32.0",
    # 1.5.2 fixes retry delays that could leave Xet downloads hung for hours.
    "hf-xet>=1.5.2,<2.0.0; platform_machine == 'x86_64' or platform_machine == 'amd64' or platform_machine == 'AMD64' or platform_machine == 'arm64' or platform_machine == 'aarch64'",
    "sentence-transformers>=6.1.0",
    # EmbeddingGemma 2's processor imports PIL even for text-only inference.
    "pillow>=10.0.0",
    # The Gemma processor also constructs its vision/video preprocessors.
    "torchvision>=0.24.0",
    "soundfile>=0.12.1",
    "scipy>=1.11.0",
    "mxbai-rerank>=0.1.0",
    # System and utilities
    "psutil>=5.9.0",
    "numpy>=1.24.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
cuda-quant = [
    "bitsandbytes>=0.50.1",
]
metal-quant = [
    "kernels>=0.17.0",
]
onnx = [
    "onnxruntime>=1.18.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/prolix-oc/bananabread-emb"
Documentation = "https://github.com/prolix-oc/bananabread-emb#readme"
Repository = "https://github.com/prolix-oc/bananabread-emb.git"
Issues = "https://github.com/prolix-oc/bananabread-emb/issues"

[project.scripts]
bananabread-emb = "bananabread.main:main"

[tool.setuptools.packages.find]
include = ["bananabread*"]

[tool.black]
line-length = 100
target-version = ['py313']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.uv]
index-strategy = "unsafe-best-match"

[tool.uv.sources]
torch = [
    { index = "pytorch", marker = "sys_platform != 'darwin'" },
    { index = "pypi-macos", marker = "sys_platform == 'darwin'" },
]
torchvision = [
    { index = "pytorch", marker = "sys_platform != 'darwin'" },
    { index = "pypi-macos", marker = "sys_platform == 'darwin'" },
]

# Also expose this index to transitive ROCm runtime dependencies (triton-rocm).
[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130"

[[tool.uv.index]]
name = "pypi-macos"
url = "https://pypi.org/simple"
explicit = true
